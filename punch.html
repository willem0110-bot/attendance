<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>星安快速打卡</title>
<script src="https://cdn.tailwindcss.com"></script>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&family=Cormorant+Garamond:ital,wght@1,500;1,600&display=swap" rel="stylesheet">
<style>
  *{font-family:'Noto Sans TC',sans-serif;-webkit-tap-highlight-color:transparent}
  .serif{font-family:'Noto Serif TC',serif}
  .ital{font-family:'Cormorant Garamond',serif;font-style:italic}
  body{margin:0;min-height:100vh;background:#F7F3EA;color:#2A2622}
  .card{background:#FFFBF5;border:1px solid rgba(184,74,47,.08);border-radius:24px;box-shadow:0 8px 30px rgba(120,80,60,.06)}
  .brick{color:#B84A2F}
  .tabnum{font-variant-numeric:tabular-nums}
  .act{transition:transform .15s ease, box-shadow .2s ease}
  .act:active{transform:scale(.96)}
  .suggest{box-shadow:0 0 0 2px #B84A2F, 0 8px 22px rgba(184,74,47,.18)}
  .fade{animation:fade .3s ease}
  .rise{animation:rise .32s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
  .spin{width:26px;height:26px;border:3px solid rgba(184,74,47,.18);border-top-color:#B84A2F;border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
  @keyframes spin{to{transform:rotate(360deg)}}
  .dot{width:7px;height:7px;border-radius:50%;display:inline-block;background:#5C8F5C;animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
</style>
</head>
<body class="flex items-center justify-center p-5">
<div class="w-full max-w-md">

  <!-- 載入中 -->
  <div id="screen-loading" class="card p-8 text-center fade">
    <img src="logo.png" onerror="this.style.display='none'" class="w-16 h-16 mx-auto rounded-full mb-4" alt="星安">
    <div class="ital text-sm tracking-widest brick mb-1">— quick clock —</div>
    <h1 class="serif text-xl font-bold mb-5">星安快速打卡</h1>
    <div class="spin"></div>
    <p id="loading-text" class="text-gray-500 text-sm mt-5">正在確認您的 LINE 身分…</p>
  </div>

  <!-- 提示／錯誤 -->
  <div id="screen-notice" class="card p-8 text-center hidden rise">
    <div id="notice-icon" class="text-5xl mb-3">📌</div>
    <h2 id="notice-title" class="serif text-xl font-bold mb-2"></h2>
    <p id="notice-body" class="text-gray-500 text-sm leading-relaxed" style="white-space:pre-line"></p>
    <button id="notice-retry" onclick="init()" class="hidden mt-6 w-full py-3 rounded-2xl bg-[#B84A2F] text-white font-bold act">重新感應打卡</button>
    <button id="notice-relogin" onclick="fullLogout()" class="hidden mt-3 w-full py-3 rounded-2xl bg-gray-100 text-gray-700 font-bold act">清除登入資料，重新登入</button>
  </div>

  <!-- 打卡主畫面 -->
  <div id="screen-punch" class="hidden space-y-4">
    <div class="card p-6 rise">
      <div class="flex items-center justify-between">
        <div>
          <div class="ital text-sm tracking-widest brick">— clock in / out —</div>
          <h2 class="serif text-2xl font-black mt-1"><span id="p-name"></span> 老師</h2>
        </div>
        <img src="logo.png" onerror="this.style.display='none'" class="w-12 h-12 rounded-full object-cover" alt="星安">
      </div>
      <div class="mt-4 rounded-2xl bg-[#F7F3EA] px-4 py-3 text-center">
        <p id="p-date" class="text-xs text-gray-500 font-medium"></p>
        <p id="p-clock" class="serif text-4xl font-black tabnum mt-0.5"></p>
      </div>
      <div class="flex items-center justify-between mt-3">
        <div class="flex items-center gap-2 text-xs text-gray-400"><span class="dot"></span><span>打卡時將自動驗證所在位置</span></div>
        <button onclick="fullLogout()" class="text-xs text-gray-400 underline underline-offset-2">換人</button>
      </div>
    </div>

    <div id="p-grid" class="grid grid-cols-2 gap-3 rise"></div>

    <p class="text-center text-xs text-gray-400 pt-1">感應後點一下即可打卡 · 系統自動記錄真實 LINE 身分</p>
  </div>

  <!-- 結果彈窗 -->
  <div id="modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-6" style="background:rgba(42,38,34,.45)">
    <div class="card w-full max-w-xs p-7 text-center rise">
      <div id="m-icon" class="text-5xl mb-2"></div>
      <h3 id="m-title" class="serif text-xl font-bold"></h3>
      <p id="m-msg" class="text-sm text-gray-600 mt-1"></p>
      <p id="m-sub" class="tabnum text-sm text-gray-400 mt-1"></p>
      <button id="m-close" onclick="closeModal()" class="hidden mt-5 w-full py-2.5 rounded-2xl bg-[#F7F3EA] text-gray-700 font-bold act">完成</button>
    </div>
  </div>

</div>

<script>
/* ===== 設定 ===== */
// ⚠️ 這一行請換成「打卡專用」的新 LIFF ID（端點 URL 設 .../attendance/punch.html，需與教師出缺勤同一個 channel 2009933933）
const LIFF_ID = "2009933933-qlWpU94m";
const GAS_URL = "https://script.google.com/macros/s/AKfycbzAcOALIahXzmd3M2aLSVsmAUjAUkqyfEKOAWed0sRN1k2F5wMHsRacQ3r3Ql4Go0r-Xw/exec";
const IDLE_MS = 120000; // 閒置 2 分鐘自動清除身分

/* ===== 動作定義（沿用現有後端 action 名稱與粉彩配色）===== */
const ACTIONS = [
  { key: "上班",     en: "Clock In",  icon: "☀️", bg: "#E8F1E5" },
  { key: "午休外出", en: "Lunch Out", icon: "🍱", bg: "#FBE8D8" },
  { key: "午休返回", en: "Lunch In",  icon: "🔙", bg: "#E8E4F1" },
  { key: "下班",     en: "Clock Out", icon: "🌙", bg: "#FBE0DE" },
];

let userId = null, userName = "", gpsCache = null;
let lastActivity = Date.now(), idleCleared = false, clockTimer = null;

/* ===== 畫面切換 ===== */
function show(id){
  ["screen-loading","screen-notice","screen-punch"].forEach(s=>{
    document.getElementById(s).classList.toggle("hidden", s!==id);
  });
}
function notice(icon, title, body, retry, relogin){
  document.getElementById("notice-icon").textContent = icon;
  document.getElementById("notice-title").textContent = title;
  document.getElementById("notice-body").textContent = body;
  document.getElementById("notice-retry").classList.toggle("hidden", !retry);
  var rl = document.getElementById("notice-relogin");
  if(rl) rl.classList.toggle("hidden", !relogin);
  show("screen-notice");
}

/* ===== 後端通訊（與主系統相同）===== */
/* v9.4 唯讀請求自動重試
   LINE 內建瀏覽器冷啟動時，第一個跨網域請求常會失敗（GAS /exec 會 302 轉址），
   造成老師必須手動按第二次才成功。check 與 verifyPunch 都是唯讀的，
   重試不會有副作用；打卡寫入則一次都不重試，避免重複紀錄。 */
var XG_RETRY_SAFE = ["check", "verifyPunch"];

function _xgSleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }

async function _postOnce(p){
  const r = await fetch(GAS_URL, { method:"POST", headers:{ "Content-Type":"text/plain" }, body: JSON.stringify(p) });
  const txt = await r.text();
  try{ return { ok:true, data: JSON.parse(txt) }; }
  catch(e){
    let hint = "\u5f8c\u7aef\u56de\u61c9\u683c\u5f0f\u7570\u5e38";
    if(/\u6388\u6b0a|Authorization required/i.test(txt)) hint = "\u5f8c\u7aef\u9700\u8981\u91cd\u65b0\u6388\u6b0a\uff0c\u8acb\u8f49\u544a\u5712\u9577";
    else if(/Page Not Found|<html|<!DOCTYPE/i.test(txt)) hint = "\u7cfb\u7d71\u5fd9\u788c\u4e2d\uff0c\u8acb\u7a0d\u5f8c\u518d\u8a66";
    return { ok:false, msg:hint };
  }
}

async function postToGAS(p){
  const safe = !!(p && p.action && XG_RETRY_SAFE.indexOf(p.action) >= 0);
  const tries = safe ? 3 : 1;
  let last = "\u9023\u7dda\u5931\u6557";
  for(let i = 0; i < tries; i++){
    if(i > 0) await _xgSleep(700 * i);
    let res;
    try{
      res = await _postOnce(p);
    }catch(netErr){
      last = (netErr && netErr.message) ? netErr.message : String(netErr);
      continue;
    }
    if(res.ok) return res.data;
    last = res.msg;
  }
  const err = new Error(last);
  err.xgStep = "backend";
  err.xgTransient = true;
  throw err;
}

/* ===== 定位（v9.5 兩段式）=====
   舊版用 enableHighAccuracy:true + maximumAge:0，等於「每次都要全新的衛星定位」。
   老師在室內收不到衛星訊號，苦等 15 秒後逾時 →「跑很久然後定位失敗」，
   第二次才成功是因為系統層已經有定位了。
   改為：
     第一段 低精度（WiFi／基地台），室內最快，接受 60 秒內的既有定位
     第二段 精度不足或失敗時，才用高精度重試
   並確保同一時間只有一個定位請求，避免 prefetch 與 ensure 互相競爭。 */

var XG_GPS_ACC_LIMIT = 120;   // 低精度定位可接受的誤差上限（公尺）；校園允許範圍 200m
var gpsInflight = null;

function getLocation(opts){
  return new Promise((res, rej)=>{
    if(!navigator.geolocation){ rej(new Error("\u6b64\u88dd\u7f6e\u4e0d\u652f\u63f4\u5b9a\u4f4d")); return; }
    navigator.geolocation.getCurrentPosition(
      p => res({ lat:p.coords.latitude, lon:p.coords.longitude, acc:p.coords.accuracy }),
      e => { const m={1:"\u5b9a\u4f4d\u6b0a\u9650\u88ab\u62d2\u7d55",2:"\u76ee\u524d\u7121\u6cd5\u5b9a\u4f4d",3:"\u5b9a\u4f4d\u903e\u6642"}; rej(new Error(m[e.code]||"\u5b9a\u4f4d\u5931\u6557")); },
      opts
    );
  });
}

async function acquireGPS(){
  /* 第一段：低精度、允許 60 秒內的既有定位。室內通常 1 秒內回應 */
  try{
    const fast = await getLocation({ enableHighAccuracy:false, timeout:8000, maximumAge:60000 });
    if(!fast.acc || fast.acc <= XG_GPS_ACC_LIMIT) return fast;
  }catch(e){ /* 落到第二段 */ }

  /* 第二段：高精度重試，仍允許 60 秒內的既有定位 */
  return await getLocation({ enableHighAccuracy:true, timeout:15000, maximumAge:60000 });
}

/* 同一時間只跑一個定位請求；重複呼叫共用同一個 Promise */
function requestGPS(){
  if(gpsInflight) return gpsInflight;
  gpsInflight = acquireGPS().then(function(p){
    gpsCache = { lat:p.lat, lon:p.lon, acc:p.acc, ts:Date.now() };
    gpsInflight = null;
    return gpsCache;
  }).catch(function(err){
    gpsInflight = null;
    throw err;
  });
  return gpsInflight;
}

async function prefetchGPS(){ try{ await requestGPS(); }catch(e){} }

async function ensureGPS(){
  if(gpsCache && Date.now() - gpsCache.ts < 90000) return gpsCache;
  return await requestGPS();
}

/* ===== 初始化 ===== */
async function init(){
  if(LIFF_ID.indexOf("___") !== -1){
    notice("🛠️", "尚未設定打卡 LIFF ID",
      "請先在 LINE Developers 建立打卡頁的 LIFF（端點設 punch.html），再把 LIFF ID 填入檔案頂端。", false);
    return;
  }
  document.getElementById("notice-retry").classList.add("hidden");
  document.getElementById("loading-text").textContent = "正在確認您的 LINE 身分…";
  show("screen-loading");
  idleCleared = false; lastActivity = Date.now();
  var step = "start";
  try{
    step = "liff.init";
    await liff.init({ liffId: LIFF_ID });

    step = "liff.isLoggedIn";
    if(!liff.isLoggedIn()){ liff.login(); return; }

    step = "liff.getProfile";
    const prof = await liff.getProfile();
    userId = prof.userId;
    if(!userId) throw new Error("\u53d6\u4e0d\u5230 LINE \u4f7f\u7528\u8005\u8b58\u5225\u78bc");

    prefetchGPS(); // 背景先要定位，加快打卡

    step = "backend";
    const r = await postToGAS({ uid:userId, action:"check", lat:0, lon:0 });
    if(r && r.status === "unregistered"){
      notice("\ud83d\udc4b", "\u7b2c\u4e00\u6b21\u4f7f\u7528\uff0c\u8acb\u5148\u5b8c\u6210\u7d81\u5b9a",
        "\u8acb\u5148\u958b\u555f\u300c\u6559\u5e2b\u51fa\u7f3a\u52e4\u7cfb\u7d71\u300d\u5b8c\u6210\u8a3b\u518a\uff08\u90e8\u9580\uff0f\u89d2\u8272\uff0f\u5230\u8077\u65e5\uff09\uff0c\u4e4b\u5f8c\u5c31\u80fd\u7528\u9019\u5f35 QR \u5feb\u901f\u6253\u5361\u3002", false, false);
      return;
    }
    userName = (r && r.name) || "\u8001\u5e2b";
    renderPunch();

  }catch(e){
    var failedAt = e && e.xgStep ? e.xgStep : step;
    var raw = (e && e.message) ? String(e.message) : "";
    var name = (e && e.name) ? String(e.name) : "";

    var title, body, showRelogin = false;
    if(failedAt === "backend"){
      title = "\u7121\u6cd5\u9023\u7dda\u5230\u7cfb\u7d71";
      body = (raw || "\u8acb\u7a0d\u5f8c\u518d\u8a66") + "\n\uff08\u6253\u5361\u5c1a\u672a\u9001\u51fa\uff0c\u53ef\u4ee5\u5b89\u5fc3\u91cd\u8a66\uff09";
    }else if(failedAt === "liff.getProfile"){
      title = "\u53d6\u5f97 LINE \u8cc7\u6599\u5931\u6557";
      body = "\u767b\u5165\u8cc7\u6599\u53ef\u80fd\u5df2\u904e\u671f\u3002\u8acb\u6309\u4e0b\u65b9\u300c\u6e05\u9664\u767b\u5165\u8cc7\u6599\u300d\u91cd\u65b0\u767b\u5165\u3002\n\uff08" + name + "\uff1a" + raw + "\uff09";
      showRelogin = true;
    }else{
      title = "LINE \u9a57\u8b49\u5931\u6557";
      body = "\u5931\u6557\u6b65\u9a5f\uff1a" + failedAt + "\n" + (name ? name + "\uff1a" : "") + (raw || "\u672a\u77e5\u932f\u8aa4") +
             "\n\n\u8acb\u5148\u5b8c\u5168\u95dc\u9589 LINE \u518d\u6383\u4e00\u6b21 QR\uff1b\u82e5\u4ecd\u7121\u6548\uff0c\u8acb\u6309\u300c\u6e05\u9664\u767b\u5165\u8cc7\u6599\u300d\u3002";
      showRelogin = true;
    }
    notice("\u26a0\ufe0f", title, body, true, showRelogin);
    try{ console.error("[punch] failed at", failedAt, e); }catch(_){}
  }
}

/* ===== 主畫面 ===== */
function suggested(){ return new Date().getHours() < 12 ? "上班" : "下班"; }

function renderPunch(){
  document.getElementById("p-name").textContent = userName;
  updateClock();
  if(clockTimer) clearInterval(clockTimer);
  clockTimer = setInterval(updateClock, 1000);

  const sug = suggested();
  const grid = document.getElementById("p-grid");
  grid.innerHTML = ACTIONS.map(a=>{
    const isSug = a.key === sug;
    return `<button onclick="doPunch('${a.key}')" class="act card p-5 text-center ${isSug?'suggest':''}">
      <div class="w-14 h-14 mx-auto rounded-2xl flex items-center justify-center text-3xl mb-3" style="background:${a.bg}">${a.icon}</div>
      <div class="serif font-bold text-lg">${a.key}</div>
      <div class="ital text-xs text-gray-400">${a.en}</div>
      ${isSug?'<div class="mt-1 text-[11px] font-bold brick">建議</div>':''}
    </button>`;
  }).join("");
  show("screen-punch");
}

function updateClock(){
  const n = new Date(), z = x => String(x).padStart(2,"0");
  const wk = ["日","一","二","三","四","五","六"][n.getDay()];
  document.getElementById("p-date").textContent = `${n.getFullYear()} 年 ${n.getMonth()+1} 月 ${n.getDate()} 日（${wk}）`;
  document.getElementById("p-clock").textContent = `${z(n.getHours())}:${z(n.getMinutes())}:${z(n.getSeconds())}`;
}

/* ===== 打卡 ===== */
function openModal(){ document.getElementById("modal").classList.remove("hidden"); }
function closeModal(){ document.getElementById("modal").classList.add("hidden"); }
function setModal(icon, title, msg, sub, closable){
  document.getElementById("m-icon").textContent = icon;
  document.getElementById("m-title").textContent = title;
  document.getElementById("m-msg").textContent = msg || "";
  document.getElementById("m-sub").textContent = sub || "";
  document.getElementById("m-close").classList.toggle("hidden", !closable);
}

async function verifyAfterFailure(action){
  setModal("\u23f3", "\u78ba\u8a8d\u6253\u5361\u7d50\u679c\u2026", "\u7cfb\u7d71\u56de\u61c9\u903e\u6642\uff0c\u6b63\u5728\u70ba\u60a8\u67e5\u8b49\uff0c\u8acb\u7a0d\u5019", "", false);
  for(var i=0;i<3;i++){
    if(i>0) await new Promise(function(r){ setTimeout(r, 1500*i); });
    try{
      var v = await postToGAS({ uid:userId, action:"verifyPunch", action2:action, minutes:10 });
      if(v && v.ok) return v;
    }catch(e){ /* 查證本身也可能失敗，繼續重試 */ }
  }
  return null;
}

async function doPunch(action, confirmDuplicate){
  markActivity();
  var step = "gps";
  setModal("\u23f3", "\u5b9a\u4f4d\u4e2d\u2026", "\u9996\u6b21\u5b9a\u4f4d\u53ef\u80fd\u9700\u8981\u5e7e\u79d2", "", false); openModal();
  try{
    const g = await ensureGPS();

    step = "send";
    setModal("\u23f3", "\u50b3\u9001\u4e2d\u2026", "", "", false);
    const payload = { uid:userId, action, lat:g.lat, lon:g.lon };
    if(confirmDuplicate) payload.confirmDuplicate = true;
    const r = await postToGAS(payload);

    /* v8.9 短時間重複打卡確認 */
    if(r && r.status === "needConfirm"){
      closeModal();
      setTimeout(()=>{
        markActivity();
        if(confirm("\u26a0\ufe0f \u91cd\u8907\u6253\u5361\u78ba\u8a8d\n\n" + r.message)){ doPunch(action, true); }
      }, 120);
      return;
    }

    if(r && r.status === "ok"){
      const sub = (r.time || "") + (r.distance != null ? "  \u00b7  \u8ddd\u96e2 " + Math.round(r.distance) + " \u516c\u5c3a" : "");
      setModal("\u2705", action + " \u6253\u5361\u6210\u529f", (r.message || (userName + " \u8001\u5e2b")), sub, true);
      setTimeout(()=>{ closeModal(); }, 6000);
      return;
    }

    /* v9.3 後端拿不到寫入鎖：確定沒寫入，可以安全重試 */
    if(r && r.reason === "busy"){
      setModal("\u23f3", "\u7cfb\u7d71\u5fd9\u788c\uff0c\u5c1a\u672a\u9001\u51fa",
        (r.message || "\u8acb\u7a0d\u5019 10 \u79d2\u518d\u6309\u4e00\u6b21\u3002"), "", true);
      return;
    }

    setModal("\ud83d\udeab", "\u6253\u5361\u672a\u5b8c\u6210", (r && r.message) || "\u8acb\u7a0d\u5f8c\u518d\u8a66\u4e00\u6b21\u3002",
      (r && r.distance != null) ? "\u8ddd\u96e2 " + Math.round(r.distance) + " \u516c\u5c3a" : "", true);

  }catch(e){
    /* 定位階段失敗：確定沒送出 */
    if(step === "gps"){
      setModal("\ud83d\udccd", "\u5b9a\u4f4d\u5931\u6557", (e && e.message) || "\u8acb\u78ba\u8a8d\u5df2\u5141\u8a31\u5b9a\u4f4d\u6b0a\u9650\u5f8c\u518d\u8a66\u3002", "", true);
      return;
    }

    /* v9.3 已送出但沒收到回應 → 直接查證，不讓老師憑感覺猜 */
    const v = await verifyAfterFailure(action);

    if(v && v.found){
      setModal("\u2705", action + " \u5df2\u5b8c\u6210",
        "\u7cfb\u7d71\u56de\u61c9\u903e\u6642\uff0c\u4f46\u60a8\u7684\u6253\u5361\u5df2\u7d93\u6210\u529f\u8a18\u9304\u3002",
        "\u6253\u5361\u6642\u9593 " + v.time + "\u3000\u8acb\u52ff\u91cd\u8907\u6253\u5361", true);
      return;
    }
    if(v){
      setModal("\ud83d\udeab", "\u6253\u5361\u672a\u9001\u51fa",
        "\u5df2\u70ba\u60a8\u67e5\u8b49\uff1a\u7cfb\u7d71\u6c92\u6709\u6536\u5230\u9019\u7b46\u6253\u5361\u3002\u8acb\u518d\u6309\u4e00\u6b21\u3002", "", true);
      return;
    }
    setModal("\u26a0\ufe0f", "\u7121\u6cd5\u78ba\u8a8d\u7d50\u679c",
      "\u76ee\u524d\u7121\u6cd5\u9023\u7dda\u67e5\u8b49\u3002\u8acb\u52ff\u91cd\u8907\u6253\u5361\uff0c\u6539\u7528\u300c\u6559\u5e2b\u51fa\u7f3a\u52e4\u7cfb\u7d71\u300d\u67e5\u8a62\u7d00\u9304\uff0c\u6216\u544a\u77e5\u5712\u9577\u3002", "", true);
  }
}

/* ===== 閒置自動清除身分（共用裝置安全）===== */
function markActivity(){ lastActivity = Date.now(); }
function checkIdle(){
  if(idleCleared) return;
  if(Date.now() - lastActivity >= IDLE_MS){
    idleCleared = true;
    userId = null; userName = ""; gpsCache = null;
    if(clockTimer){ clearInterval(clockTimer); clockTimer = null; }
    closeModal();
    notice("🔒", "已自動登出", "為保護個人資料，閒置過久已清除身分。請點下方按鈕重新感應打卡。", true);
  }
}
["mousemove","mousedown","click","keydown","scroll","wheel","touchstart","touchmove","touchend","pointerdown"]
  .forEach(ev => window.addEventListener(ev, markActivity, { passive:true }));
setInterval(checkIdle, 15000);
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) checkIdle(); });
window.addEventListener("focus", checkIdle);

/* ===== 完全登出（換人）===== */
function fullLogout(){
  try{ if(window.liff && liff.logout) liff.logout(); }catch(e){}
  try{ sessionStorage.clear(); localStorage.clear(); }catch(e){}
  userId = null; userName = ""; gpsCache = null;
  history.replaceState(null, "", location.pathname);
  location.replace(location.pathname);
}

/* 啟動 */
init();
</script>
